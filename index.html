<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Libros</title>

    <!-- Styles.css está en la raíz -->
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>

    <div class="container">
        <h1>📚 Gestor de Libros / Papers</h1>

        <!-- BUSCADOR -->
        <input
            type="text"
            id="buscador"
            placeholder="Buscar por ID o nombre..."
        />

        <!-- FORMULARIO -->
        <div class="form-group">
            <label for="nombre">Nombre del libro</label>
            <input type="text" id="nombre" placeholder="Ej: Física Moderna">
        </div>

        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria">
                <option value="Libro">Libro</option>
                <option value="Paper">Paper</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paginas">Número de páginas</label>
            <input type="number" id="paginas" placeholder="Ej: 250">
        </div>

        <button id="btnAgregar">Agregar</button>


        <!-- TABLA -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Páginas</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaLibros">
                <!-- Renglones generados por main.ts -->
            </tbody>
        </table>
    </div>

    <!-- script de Vite -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
